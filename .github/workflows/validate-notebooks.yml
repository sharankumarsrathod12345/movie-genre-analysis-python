name: Validate notebooks

on:
  push:
    branches: [main]
    paths:
      - 'notebooks/**'
      - 'data/**'
      - 'outputs/**'
      - 'requirements.txt'
      - 'docs/reproducibility.json'
      - 'scripts/validate_notebooks.py'
      - '.github/workflows/validate-notebooks.yml'
  pull_request:
    paths:
      - 'notebooks/**'
      - 'data/**'
      - 'outputs/**'
      - 'requirements.txt'
      - 'docs/reproducibility.json'
      - 'scripts/validate_notebooks.py'
      - '.github/workflows/validate-notebooks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install analysis and kernel dependencies
        run: python -m pip install -r requirements.txt "nbclient>=0.10,<1" "nbformat>=5.10,<6" "ipykernel>=6,<8"
      - name: Execute fresh notebooks and reconcile results
        run: python scripts/validate_notebooks.py
      - name: Save executed notebooks and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-validation
          path: validation/
          if-no-files-found: warn
          retention-days: 14
